<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access · Argonaut</title>
  <link rel="icon" href="design-system/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#06070B; --text:#E9EDF6; --muted:#8B93A7; --faint:#5A6274;
      --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
      --cyan:#38E8FF; --violet:#A574FF; --blue:#4C6BFF;
      --font:"Space Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --body:"Inter",system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{font-family:var(--body);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

    .split{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}

    /* Left visual (rocket) */
    .visual{position:relative;overflow:hidden;background:#030407}
    .visual__img{position:absolute;inset:0;background:url("assets/rocket-launch.png") center/cover no-repeat;transform:scale(1.03);animation:slowzoom 22s ease-in-out infinite alternate}
    @keyframes slowzoom{from{transform:scale(1.03)}to{transform:scale(1.12)}}
    .visual__grad{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(6,7,11,.35) 0%,transparent 30%,rgba(6,7,11,.35) 62%,rgba(6,7,11,.92) 100%),
      linear-gradient(90deg,transparent 60%,rgba(6,7,11,.6) 100%)}
    .visual__grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 70% at 40% 30%,#000,transparent 80%);opacity:.5}
    .visual__top{position:absolute;top:32px;left:34px;z-index:2}
    .visual__caption{position:absolute;left:38px;right:38px;bottom:40px;z-index:2}
    .visual__eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:9px;margin-bottom:14px}
    .visual__eyebrow .live{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:pulse 1.8s infinite}
    .visual__caption h2{font-family:var(--font);font-weight:600;font-size:clamp(1.9rem,2.6vw,2.7rem);line-height:1.08;letter-spacing:-.01em}
    .visual__caption h2 .grad{background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
    .visual__caption p{color:rgba(233,237,246,.72);font-size:1rem;margin-top:12px;max-width:44ch}
    .visual::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:linear-gradient(180deg,transparent,var(--cyan),var(--violet),transparent);opacity:.6;z-index:3}

    /* Right console */
    .console{position:relative;display:grid;place-items:center;padding:40px 28px;overflow:hidden}
    .console__bg{position:absolute;inset:0;z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform}
    .orb-1{width:420px;height:420px;background:radial-gradient(circle,#1f6bff,transparent 65%);top:-140px;right:-120px;animation:float1 15s ease-in-out infinite}
    .orb-2{width:380px;height:380px;background:radial-gradient(circle,#8b3bff,transparent 65%);bottom:-150px;left:-120px;animation:float2 17s ease-in-out infinite}
    @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,26px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-24px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

    .card{position:relative;z-index:1;width:100%;max-width:404px;
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid var(--line);border-radius:20px;padding:36px 34px 30px;
      backdrop-filter:blur(22px) saturate(1.2);
      box-shadow:0 40px 120px -30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.1) inset;
      animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    .card::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.7}

    .brandrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font);font-weight:700;font-size:1.24rem;letter-spacing:.02em}
    .logo{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06070B;font-family:var(--font);font-weight:700;font-size:1rem;box-shadow:0 0 22px -2px rgba(56,232,255,.6)}
    .chip{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px}

    .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .eyebrow .live{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.8s infinite}
    h1{font-family:var(--font);font-weight:600;font-size:1.9rem;line-height:1.1;letter-spacing:-.01em}
    .sub{color:var(--muted);font-size:.92rem;margin-top:8px}

    form{margin-top:24px}
    .field+.field{margin-top:15px}
    label{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
    .input{width:100%;font-family:var(--body);font-size:.96rem;color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 15px;transition:border-color .2s,box-shadow .2s,background .2s}
    .input::placeholder{color:var(--faint)}
    .input:focus{outline:none;border-color:var(--cyan);background:rgba(56,232,255,.04);box-shadow:0 0 0 3px rgba(56,232,255,.12),0 0 24px -6px rgba(56,232,255,.5)}
    .row{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
    .check{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer}
    .check input{accent-color:var(--cyan);width:15px;height:15px}
    .link{color:var(--cyan);font-size:.85rem;font-weight:500}
    .link:hover{text-shadow:0 0 12px rgba(56,232,255,.6)}
    a{text-decoration:none;color:inherit}

    .btn{width:100%;font-family:var(--font);font-weight:600;font-size:1rem;color:#06070B;border:0;border-radius:12px;padding:14px;cursor:pointer;margin-top:22px;
      background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet));background-size:180% 180%;background-position:0% 50%;
      box-shadow:0 10px 30px -8px rgba(76,107,255,.6),0 0 0 1px rgba(255,255,255,.08) inset;transition:transform .15s,box-shadow .2s,background-position .5s}
    .btn:hover{background-position:100% 50%;box-shadow:0 16px 44px -8px rgba(139,59,255,.7)}
    .btn:active{transform:translateY(1px)}

    .divider{display:flex;align-items:center;gap:14px;color:var(--faint);font-size:.74rem;font-family:var(--mono);letter-spacing:.1em;margin:20px 0 15px}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
    .btn-ghost{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:500;font-size:.9rem;color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .2s,background .2s}
    .btn-ghost:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}

    .foot{margin-top:22px;text-align:center;color:var(--muted);font-size:.86rem}
    .status{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
    .status .dot{width:5px;height:5px;border-radius:50%;background:#37E8A0;box-shadow:0 0 8px #37E8A0}

    @media (prefers-reduced-motion:reduce){.orb,.card,.visual__img,.eyebrow .live,.visual__eyebrow .live{animation:none}}
    @media (max-width:900px){.split{grid-template-columns:1fr}.visual{display:none}}
  </style>
</head>
<body>
  <main class="split">
    <!-- Left: rocket visual -->
    <section class="visual">
      <div class="visual__img"></div>
      <div class="visual__grid"></div>
      <div class="visual__grad"></div>
      <div class="visual__caption">
        <p class="visual__eyebrow"><span class="live"></span>Mission control</p>
        <h2>Launch your <span class="grad">workspace.</span></h2>
        <p>Turning Your Vision Into Reality</p>
      </div>
    </section>

    <!-- Right: console -->
    <section class="console">
      <div class="console__bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

      <div class="card">
        <div class="brandrow">
          <span class="wordmark">Argonaut</span>
        </div>

        <p class="eyebrow"><span class="live"></span>Encrypted Connection</p>
        <h1>Sign in</h1>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" type="email" placeholder="you@domain.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" type="password" placeholder="••••••••••" autocomplete="current-password" required />
          </div>

          <div class="row">
            <label class="check"><input type="checkbox" checked /> Keep me signed in</label>
            <a class="link" href="#">Forgot?</a>
          </div>

          <button class="btn" type="submit">Enter workspace →</button>
        </form>

      </div>
    </section>
  </main>

  <script>
    // Mockup only — no real authentication. Any submit proceeds to the workspace.
    function enter(){ window.location.href = 'app.html'; }
    document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); enter(); });
  </script>
</body>
</html>
